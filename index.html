<style>
/* Layout: a wooden bookcase against a wall. Shelves are packed by script, oldest finished book top-left.
   Each book is a 3D box: spine faces the viewer, the front cover sits on its right edge and swings round when the book is picked up. */
:root {
  --wall: #c7d0d4;
  --glow: rgba(255, 255, 255, 0.45);
  --ink: #1d2a2e;
  --muted: #465659;
  --wood-hi: #a7764a;
  --wood-mid: #85582f;
  --wood-lo: #5f3e20;
  --back: #6f4c2f;
  --back-deep: #4a301b;
  --room: #ead9b8;
  --tag-bg: #e7d8b4;
  --tag-ink: #3a2a12;
  --card: #f6f3ec;
  --rule: rgba(0, 0, 0, 0.18);
  --accent: #7a4a12;
  --on-accent: #fff6e4;
  --focus: #ffd98a;
  --font-display: "Bodoni Moda", "Didot", Georgia, serif;
  --font-ui: "Karla", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --wall: #0f1a1e;
    --glow: rgba(255, 184, 100, 0.13);
    --ink: #e8e3d8;
    --muted: #9fabab;
    --wood-hi: #6a4529;
    --wood-mid: #4c301a;
    --wood-lo: #301d0f;
    --back: #231710;
    --back-deep: #120b07;
    --room: #b3a080;
    --card: #1b2226;
    --rule: rgba(255, 255, 255, 0.16);
    --accent: #e2ae55;
    --on-accent: #1c1305;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --wall: #0f1a1e;
  --glow: rgba(255, 184, 100, 0.13);
  --ink: #e8e3d8;
  --muted: #9fabab;
  --wood-hi: #6a4529;
  --wood-mid: #4c301a;
  --wood-lo: #301d0f;
  --back: #231710;
  --back-deep: #120b07;
  --room: #b3a080;
  --card: #1b2226;
  --rule: rgba(255, 255, 255, 0.16);
  --accent: #e2ae55;
  --on-accent: #1c1305;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: radial-gradient(900px 520px at 88% -8%, var(--glow), transparent 62%), var(--wall);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.45;
  padding-block: 28px 150px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: clip;
}
.wrap { max-width: 800px; margin-inline: auto; }

/* Header */
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 24px; }
.eyebrow { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.sample { margin-left: 10px; padding: 2px 8px; border: 1px dashed var(--muted); border-radius: 3px; letter-spacing: 0.12em; }
h1 { margin: 4px 0 0; font: 700 clamp(44px, 9vw, 80px) / 0.95 var(--font-display); letter-spacing: -0.01em; text-wrap: balance; }
h1 em { font-weight: 500; }
.stats { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { font-size: 20px; letter-spacing: 0; color: var(--ink); font-family: var(--font-display); }
.year + .year { margin-top: 84px; }
.yearhead { margin-bottom: 22px; }
.yearhead h2 { margin: 0; font: 700 clamp(34px, 6.5vw, 56px) / 1 var(--font-display); letter-spacing: -0.01em; }
.yearhead h2 em { font-weight: 500; }
.hint { margin: 14px 0 26px; max-width: 58ch; color: var(--muted); }

/* Bookcase */
.case {
  padding: 18px 18px 0;
  border-radius: 6px 6px 0 0;
  background:
    linear-gradient(90deg, rgba(0,0,0,.28), transparent 5%, transparent 95%, rgba(0,0,0,.28)),
    repeating-linear-gradient(90deg, rgba(0,0,0,.06) 0 1px, transparent 1px 7px, rgba(255,255,255,.05) 7px 8px, transparent 8px 17px),
    var(--wood-mid);
  box-shadow: 0 34px 44px -22px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.18);
}
.case::before {
  content: ""; display: block; height: 12px; margin: -18px -4px 10px;
  border-radius: 4px 4px 0 0;
  background: linear-gradient(var(--wood-hi), var(--wood-mid));
  box-shadow: 0 5px 8px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.25);
}
.inside {
  background: linear-gradient(var(--back), var(--back-deep) 160%);
  box-shadow: inset 0 12px 20px -6px rgba(0,0,0,.65), inset 9px 0 14px -8px rgba(0,0,0,.55), inset -9px 0 14px -8px rgba(0,0,0,.55);
}
.plinth {
  height: 30px; margin: 0 -18px;
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,.07) 0 1px, transparent 1px 5px),
    linear-gradient(var(--wood-mid), var(--wood-lo));
  box-shadow: inset 0 2px 0 rgba(255,255,255,.12), 0 8px 12px -4px rgba(0,0,0,.4);
}

.row { position: relative; z-index: 0; padding-top: 30px; }
.row.has-open { z-index: 10; }
.row::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 50px; background: linear-gradient(rgba(0,0,0,.42), transparent); pointer-events: none; }
.books { position: relative; z-index: 2; display: flex; align-items: flex-end; gap: 3px; padding: 0 14px; margin-bottom: 5px; }
.board {
  position: relative; z-index: 1; height: 24px;
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,.07) 0 1px, transparent 1px 4px, rgba(255,255,255,.05) 4px 5px, transparent 5px 9px),
    linear-gradient(var(--wood-hi), var(--wood-mid) 55%, var(--wood-lo));
  box-shadow: 0 14px 16px -8px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.28);
}
.board::before {
  content: ""; position: absolute; left: 0; right: 0; bottom: 100%; height: 15px;
  background: linear-gradient(var(--wood-mid), var(--wood-hi));
  clip-path: polygon(1.5% 0, 98.5% 0, 100% 100%, 0 100%);
}
.tag {
  position: absolute; left: 18px; top: 5px; height: 14px; padding: 0 8px;
  background: var(--tag-bg); color: var(--tag-ink);
  font: 700 9px / 14px var(--font-ui); letter-spacing: 0.14em; text-transform: uppercase;
  border-radius: 1px; box-shadow: 0 1px 1px rgba(0,0,0,.45), inset 0 0 0 1px rgba(0,0,0,.12);
}
.room-note {
  margin-left: auto; align-self: center; text-align: right;
  font: italic 500 15px / 1.3 var(--font-display); color: var(--room);
}

/* Books */
.slot { position: relative; flex: none; width: var(--t); height: var(--h); perspective: 900px; }
.slot::after {
  content: ""; position: absolute; left: -3px; right: -3px; bottom: -5px; height: 9px;
  background: radial-gradient(closest-side, rgba(0,0,0,.55), transparent);
  pointer-events: none; transition: opacity .3s;
}
.slot.open { z-index: 30; }
.slot.open::after { opacity: 0; }
.lift { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.2,.8,.25,1); }
.book { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; transition: transform .8s cubic-bezier(.3,.85,.3,1); }
.face { position: absolute; left: calc(var(--t) / -2); top: calc(var(--h) / -2); margin: 0; -webkit-backface-visibility: hidden; backface-visibility: hidden; }

.spine {
  width: var(--t); height: var(--h);
  transform: translateZ(calc(var(--w) / 2));
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px;
  padding: 24px 0 12px; overflow: hidden;
  background: var(--bg); color: var(--fg);
  border: 0; font: inherit; cursor: pointer; user-select: none; touch-action: manipulation;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.2);
  border-radius: 1px 1px 0 0;
}
.spine::before {
  content: ""; position: absolute; left: 0; right: 0; top: 9px; height: 7px;
  background: linear-gradient(var(--ac) 0 2px, transparent 2px 5px, var(--ac) 5px 7px);
}
.spine::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(90deg, rgba(0,0,0,.32), rgba(255,255,255,.13) 22%, rgba(255,255,255,0) 46%, rgba(0,0,0,.24));
}
.spine:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; z-index: 5; }
.s-title {
  writing-mode: vertical-rl; margin-bottom: auto; overflow: hidden;
  font-family: var(--ff); font-weight: var(--fw); font-style: var(--fst);
  text-transform: var(--tt); letter-spacing: var(--ls);
  line-height: 1.14; text-align: start; color: var(--fg);
}
.s-author {
  writing-mode: vertical-rl; white-space: nowrap;
  font-family: var(--font-ui); font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
  line-height: 1; opacity: .88;
}
.mark { flex: none; width: 7px; height: 7px; border: 1.5px solid var(--ac); transform: rotate(45deg); margin-top: 3px; }

.cover {
  position: absolute; left: calc(var(--w) / -2); top: calc(var(--h) / -2);
  width: var(--w); height: var(--h);
  transform: rotateY(90deg) translateZ(calc(var(--t) / 2));
  display: block; overflow: hidden; text-decoration: none;
  background: var(--bg); color: var(--fg);
  border-radius: 2px 5px 5px 2px;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.22);
  pointer-events: none; cursor: pointer;
}
.slot.open .cover { pointer-events: auto; box-shadow: inset 0 0 0 1px rgba(0,0,0,.22), 0 22px 34px -8px rgba(0,0,0,.55); }
.cover::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(90deg, rgba(0,0,0,.38) 0, rgba(0,0,0,0) 2.2%, rgba(255,255,255,.18) 3.6%, rgba(0,0,0,.10) 5.4%, rgba(0,0,0,0) 8%),
    linear-gradient(135deg, rgba(255,255,255,.12), transparent 42%);
}
.spine.photo { padding: 0; border-radius: 0; background-size: 100% 100%; background-position: center; background-repeat: no-repeat; }
.spine.photo::before { display: none; }
.spine.photo::after { background: linear-gradient(90deg, rgba(0,0,0,.28), rgba(255,255,255,.07) 24%, rgba(255,255,255,0) 50%, rgba(0,0,0,.22)); }
.cover.photo { background-size: 100% 100%; background-position: center; background-repeat: no-repeat; border-radius: 1px 3px 3px 1px; }
.cover.photo::after { background: linear-gradient(90deg, rgba(0,0,0,.3) 0, rgba(0,0,0,0) 2%, rgba(255,255,255,.12) 3%, rgba(0,0,0,.06) 4.5%, rgba(0,0,0,0) 7%); }
.cover:hover { filter: brightness(1.07); }
.cover:focus-visible { outline: 3px solid var(--focus); outline-offset: -5px; }
.c-art { position: absolute; display: block; }
.c-in { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 11% 11% 10% 14%; }
.c-title {
  font-family: var(--ff); font-weight: var(--fw); font-style: var(--fst);
  text-transform: var(--tt); letter-spacing: var(--ls); line-height: 1.08; text-wrap: balance;
}
.c-author { font-family: var(--font-ui); font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; line-height: 1.3; }

.v0 .c-art { inset: 6% 6% 6% 9%; border: 2px solid var(--ac); }
.v0 .c-in { text-align: center; justify-content: space-between; padding: 17% 15% 14% 18%; }
.v1 .c-art { left: 50%; top: 9%; width: 58%; aspect-ratio: 1; transform: translateX(-50%); border-radius: 50%; background: var(--ac); }
.v1 .c-in { justify-content: flex-end; gap: 7%; }
.v2 .c-art { left: 0; right: 0; top: 34%; height: 32%; background: var(--ac); }
.v2 .c-in { justify-content: flex-end; }
.v2 .c-title { position: absolute; left: 14%; right: 11%; top: 34%; height: 32%; display: flex; align-items: center; color: var(--oa); }
.v3 .c-art { left: 0; right: 0; bottom: 0; height: 33%; background: repeating-linear-gradient(90deg, var(--ac) 0 7px, transparent 7px 14px); }
.v3 .c-in { justify-content: space-between; padding-bottom: 38%; }
.v4 .c-art { left: 50%; top: 9%; width: 58%; height: 43%; transform: translateX(-50%); border-radius: 999px 999px 0 0; background: var(--ac); }
.v4 .c-in { justify-content: flex-end; text-align: center; gap: 7%; padding-left: 13%; }

/* Lifting a book off the shelf: it comes forward first, then turns to show the cover. */
@media (hover: hover) {
  .slot:not(.open):hover .lift { transform: translate3d(0, -6px, 26px); }
}
.slot.open .lift { transform: translate3d(var(--dx, 0px), -16px, var(--z, 170px)); }
.slot.open .book { transform: rotateY(-90deg); transition-delay: .18s; }
.slot.settling .lift { transition-delay: .3s; }

/* Catalog card */
.card {
  position: fixed; z-index: 60;
  left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  max-width: 600px; margin-inline: auto;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px;
  padding: 14px 16px; background: var(--card); color: var(--ink);
  border: 1px solid var(--rule); border-radius: 8px;
  box-shadow: 0 18px 40px -12px rgba(0,0,0,.5);
}
.card[hidden] { display: none; }
.card-text { min-width: 0; flex: 1 1 240px; }
.card-meta { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
.card h2 { margin: 2px 0 0; font: 700 22px / 1.15 var(--font-display); text-wrap: balance; }
.card-author { margin: 2px 0 0; color: var(--muted); }
.card-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px;
  border: 1px solid var(--accent); border-radius: 6px;
  background: var(--accent); color: var(--on-accent);
  font: 700 14px / 1 var(--font-ui); text-decoration: none; cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--rule); }
.btn:hover { filter: brightness(1.08); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (max-width: 520px) {
  .case { padding-inline: 12px; }
  .case::before { margin-inline: -4px; }
  .plinth { margin-inline: -12px; }
}
@media (prefers-reduced-motion: reduce) {
  .lift, .book, .slot::after { transition-duration: .01s; transition-delay: 0s !important; }
}
</style>

    return { fs: d.w * k * TYPE[b.type].cs, afs: Math.max(8, d.w * 0.058) };
  }

  function makeSlot(b, d, u) {
    const T = TYPE[b.type], p = b.pal;
    const s = fitSpine(b, d), c = coverSize(b, d);
    const el = document.createElement("div");
    el.className = "slot";
    el.dataset.i = b.i;
    el._d = d; el._u = u;
    const vars = {
      "--t": d.t + "px", "--h": d.h + "px", "--w": d.w + "px",
      "--bg": p[0], "--fg": p[1], "--ac": p[2], "--oa": p[3],
      "--ff": T.ff, "--fw": T.fw, "--fst": T.fst, "--tt": T.tt, "--ls": T.ls
    };
    Object.keys(vars).forEach((k) => el.style.setProperty(k, vars[k]));
    const label = esc(b.title) + " by " + esc(b.author);
    const spineBody = b.spine
      ? ""
      : '<span class="s-title" style="font-size:' + s.fs.toFixed(1) + "px;max-height:" + Math.floor(s.avail) + 'px">' + esc(b.short) + "</span>" +
        (s.showAuthor ? '<span class="s-author" style="font-size:' + s.afs.toFixed(1) + 'px">' + esc(b.last) + "</span>" : "") +
        '<i class="mark"></i>';
    const coverBody = b.cover
      ? ""
      : '<span class="c-art"></span>' +
        '<span class="c-in"><span class="c-title" style="font-size:' + c.fs.toFixed(1) + 'px">' + esc(b.short) + '</span>' +
        '<span class="c-author" style="font-size:' + c.afs.toFixed(1) + 'px">' + esc(b.author) + "</span></span>";
    const spineStyle = b.spine ? ' style="background-image:url(\'' + esc(b.spine) + '\')"' : "";
    const coverStyle = b.cover ? ' style="background-image:url(\'' + esc(b.cover) + '\')"' : "";
    el.innerHTML =
      '<div class="lift"><div class="book">' +
        '<button type="button" class="face spine' + (b.spine ? " photo" : "") + '"' + spineStyle + ' aria-expanded="false" aria-label="Take ' + label + ' off the shelf">' + spineBody + "</button>" +
        '<a class="cover v' + b.variant + (b.cover ? " photo" : "") + '"' + coverStyle + ' href="' + esc(b.href) + '" target="_blank" rel="noopener noreferrer" tabindex="-1" aria-hidden="true" aria-label="' + label + ' on Goodreads, opens in a new tab">' +
          coverBody +
        "</a>" +
      "</div></div>";
    return el;
  }

  let slots = [], openIdx = -1, lastW = 0;

  function mk(tag, cls) { const e = document.createElement(tag); e.className = cls; return e; }

  function layout() {
    openIdx = -1;
    card.hidden = true;
    casesEl.textContent = "";
    lastW = casesEl.clientWidth;

    const parts = YEARS.map((y, yi) => {
      const sec = mk("section", "year");
      if (yi > 0) {
        const hd = mk("div", "head yearhead");
        hd.innerHTML = '<h2>Read <em>in</em> ' + y + '</h2><p class="stats">' + statsHTML(y) + "</p>";
        sec.appendChild(hd);
      }
      const kase = mk("div", "case"), inside = mk("div", "inside"), plinth = mk("div", "plinth");
      kase.appendChild(inside); kase.appendChild(plinth); sec.appendChild(kase);
      casesEl.appendChild(sec);
      return { y: y, inside: inside };
    });

    const inner = parts[0].inside.clientWidth || 700;
    const u = Math.min(1, Math.max(0.72, inner / 780));
    const gap = 3, usable = inner - 28;
    const dims = books.map((b) => {
      const h = Math.round(b.h0 * u);
      return {
        h: h,
        t: b.spine && b.sr ? Math.max(22, Math.round(h * b.sr)) : Math.round(b.t0 * u),
        w: Math.round(h * (b.cr || 0.66))
      };
    });

    slots = new Array(books.length);
    parts.forEach((part) => {
      const ids = books.filter((b) => b.year === part.y).map((b) => b.i);
      const rows = [];
      let cur = [], used = 0;
      ids.forEach((i) => {
        const add = dims[i].t + (cur.length ? gap : 0);
        if (cur.length && used + add > usable) { rows.push({ idx: cur, used: used }); cur = []; used = 0; }
        used += dims[i].t + (cur.length ? gap : 0);
        cur.push(i);
      });
      if (cur.length) rows.push({ idx: cur, used: used });

      rows.forEach((r, ri) => {
        const row = mk("div", "row");
        const wrap = mk("div", "books");
        r.idx.forEach((i) => {
          const s = makeSlot(books[i], dims[i], u);
          slots[i] = s;
          wrap.appendChild(s);
        });

        const left = usable - r.used;
        const now = new Date();
        if (ri === rows.length - 1 && left > 150 && part.y === YEAR && now.getFullYear() === YEAR) {
          const days = Math.ceil((new Date(YEAR, 11, 31) - now) / 864e5);
          if (days > 0) {
            const note = mk("span", "room-note");
            note.style.maxWidth = Math.min(240, left - 16) + "px";
            note.textContent = "Room for more. " + days + " days left in " + YEAR + ".";
            wrap.appendChild(note);
          }
        }

        const board = mk("div", "board");
        const m1 = fmtMonth(books[r.idx[0]].date), m2 = fmtMonth(books[r.idx[r.idx.length - 1]].date);
        const tag = mk("span", "tag");
        tag.textContent = m1 === m2 ? m1 : m1 + " – " + m2;
        board.appendChild(tag);

        row.appendChild(wrap);
        row.appendChild(board);
        part.inside.appendChild(row);
      });
    });
  }

  function openBook(i) {
    if (openIdx === i) return;
    closeBook();
    const s = slots[i], b = books[i], d = s._d;
    const z = Math.round(170 + (1 - s._u) * 460);
    const sc = P / (P - z);
    const r = s.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const half = (d.w * sc) / 2;
    const vw = document.documentElement.clientWidth;
    const m = 8;
    const target = Math.min(Math.max(cx, m + half), vw - m - half);
    s.style.setProperty("--z", z + "px");
    s.style.setProperty("--dx", (target - cx) / sc + "px");
    s.classList.remove("settling");
    s.classList.add("open");
    s.closest(".row").classList.add("has-open");
    s.querySelector(".spine").setAttribute("aria-expanded", "true");
    const cover = s.querySelector(".cover");
    cover.removeAttribute("aria-hidden");
    cover.tabIndex = 0;
    openIdx = i;

    const when = b.undated ? "Read in " + b.year : b.finished.slice(8) === "01" ? "Read " + fmtMonthYear(b.date) : "Finished " + fmtDate(b.date);
    $("#cMeta").textContent = when + (b.pages ? " · " + b.pages + " pages" : "") + (b.rating ? " · ★ " + b.rating : "");
    $("#cTitle").textContent = b.title;
    $("#cAuthor").textContent = b.author;
    $("#cLink").href = b.href;
    card.hidden = false;
  }

  function closeBook() {
    if (openIdx < 0) return;
    const s = slots[openIdx];
    const row = s.closest(".row");
    s.classList.remove("open");
    s.classList.add("settling");
    s.querySelector(".spine").setAttribute("aria-expanded", "false");
    const cover = s.querySelector(".cover");
    cover.setAttribute("aria-hidden", "true");
    cover.tabIndex = -1;
    setTimeout(() => {
      s.classList.remove("settling");
      if (!s.classList.contains("open")) row.classList.remove("has-open");
    }, 1000);
    openIdx = -1;
    card.hidden = true;
  }

  casesEl.addEventListener("click", (e) => {
    const btn = e.target.closest(".spine");
    if (!btn) return;
    const i = Number(btn.closest(".slot").dataset.i);
    if (i === openIdx) closeBook(); else openBook(i);
  });
  casesEl.addEventListener("keydown", (e) => {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    const btn = e.target.closest(".spine");
    if (!btn) return;
    const all = Array.prototype.slice.call(casesEl.querySelectorAll(".spine"));
    const next = all[all.indexOf(btn) + (e.key === "ArrowRight" ? 1 : -1)];
    if (next) { e.preventDefault(); next.focus(); }
  });
  document.addEventListener("click", (e) => {
    if (openIdx >= 0 && !e.target.closest(".slot") && !e.target.closest("#card")) closeBook();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && openIdx >= 0) {
      const spine = slots[openIdx].querySelector(".spine");
      closeBook();
      spine.focus();
    }
  });
  $("#cBack").addEventListener("click", closeBook);

  layout();
  if (typeof ResizeObserver !== "undefined") {
    new ResizeObserver(() => {
      if (Math.abs(casesEl.clientWidth - lastW) > 1) layout();
    }).observe(casesEl);
  }
})();
</script>

</body></html>
